name: 构建身份证识别桌面App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - feature/fixPlan_0731
    paths:
      - "id_card_ocr_app.pyw"
      - "idcard_ocr/**"
      - "desktop_app.spec"
      - "scripts/build_macos.sh"
      - "scripts/build_windows.ps1"
      - ".github/workflows/build-desktop-app.yml"

jobs:
  build-macos:
    name: 构建macOS App
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 配置Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 构建App
        run: PYTHON=python3 ./scripts/build_macos.sh
      - name: 验证macOS App启动和内置OCR
        run: |
          mkdir -p self-test-input self-test-output
          cp "test_data/id_card_samples_100/模拟身份证_001.jpg" self-test-input/
          "dist/身份证识别.app/Contents/MacOS/身份证识别" --self-test "$PWD/self-test-input" "$PWD/self-test-output"
          test -f "self-test-output/身份证识别自检.xlsx"
      - name: 压缩App
        run: ditto -c -k --sequesterRsrc --keepParent "dist/身份证识别.app" "dist/身份证识别-macOS.zip"
      - name: 上传macOS安装包
        uses: actions/upload-artifact@v4
        with:
          name: 身份证识别-macOS
          path: dist/身份证识别-macOS.zip

  build-windows:
    name: 构建Windows App
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 配置Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安装Tesseract
        shell: pwsh
        run: choco install tesseract --no-progress -y
      - name: 验证Windows构建脚本语法
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\scripts\build_windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error file=scripts/build_windows.ps1::$($_.Message)" }
            exit 1
          }
      - name: 构建App
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: 验证Windows App启动和内置OCR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "self-test-input", "self-test-output" | Out-Null
          Copy-Item "test_data\id_card_samples_100\模拟身份证_001.jpg" "self-test-input\"
          & "dist\身份证识别\身份证识别.exe" --self-test (Resolve-Path "self-test-input") (Resolve-Path "self-test-output")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "self-test-output\身份证识别自检.xlsx")) { exit 1 }
      - name: 压缩App
        shell: pwsh
        run: Compress-Archive -Path "dist\身份证识别\*" -DestinationPath "dist\身份证识别-Windows.zip"
      - name: 上传Windows安装包
        uses: actions/upload-artifact@v4
        with:
          name: 身份证识别-Windows
          path: dist/身份证识别-Windows.zip
