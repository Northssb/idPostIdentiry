name: 临时 Windows 身份证识别验证

on:
  push:
    branches:
      - feature/planSeetting-2026-07-22

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装本地 Tesseract
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $install = "C:\Program Files\Tesseract-OCR"
          $tessdata = Join-Path $install "tessdata"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata" `
            -OutFile (Join-Path $tessdata "chi_sim.traineddata")
          $install | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 准备正常和180度模拟身份证图片
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "测试 输入 空格\正常" | Out-Null
          New-Item -ItemType Directory -Force "测试 输入 空格\旋转180" | Out-Null
          Copy-Item ".github\windows-fixtures\normal.jpg" "测试 输入 空格\正常\身份证 正面.JPG"
          Copy-Item ".github\windows-fixtures\rotate180.jpg" "测试 输入 空格\旋转180\身份证 旋转180.JPG"

      - name: 诊断 Windows 批处理和导出
        shell: pwsh
        run: |
          $env:IDCARD_OCR_BACKEND = "tesseract"
          $output = python -c "from pathlib import Path; from idcard_ocr.core import BatchProcessor, export_xlsx, resolve_output_path, scan_images; from idcard_ocr.ocr import create_ocr_backend; source=Path(r'测试 输入 空格\正常'); target=resolve_output_path(Path(r'诊断 输出 空格'), '诊断结果.xlsx', False); backend=create_ocr_backend(); rows, summary=BatchProcessor(source, backend).process(scan_images(source)); assert summary.succeeded == 1; export_xlsx(target, rows); assert target.is_file()" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if ($exitCode -ne 0) {
            $message = ($output -join " | ").Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=WINDOWS_PIPELINE_TRACE::$message"
            throw "Windows 批处理或导出诊断失败：$exitCode"
          }

      - name: 验证正常方向识别和 Excel 文本格式
        shell: pwsh
        run: |
          $env:IDCARD_OCR_BACKEND = "tesseract"
          $output = python id_card_ocr.py `
            --input-dir "测试 输入 空格\正常" `
            --output-dir "测试 输出 空格\正常" `
            --output-name "识别结果.xlsx" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if ($exitCode -ne 0) {
            $message = ($output -join " | ").Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=WINDOWS_NORMAL_OCR::$message"
            throw "正常方向识别退出码不是0：$exitCode"
          }
          @'
          import zipfile
          path = r"测试 输出 空格\正常\识别结果.xlsx"
          with zipfile.ZipFile(path) as archive:
              sheet = archive.read("xl/worksheets/sheet1.xml").decode()
              workbook = archive.read("xl/workbook.xml").decode()
          assert "孙安宁" in sheet
          assert "990000198210070038" in sheet
          assert 'r="C2" t="inlineStr" s="2"' in sheet
          assert "识别结果" in workbook
          assert "待人工复核" in workbook
          print("WINDOWS_NORMAL_XLSX_OK")
          '@ | python -

      - name: 验证180度方向兜底
        shell: pwsh
        run: |
          $env:IDCARD_OCR_BACKEND = "tesseract"
          $output = python id_card_ocr.py `
            --input-dir "测试 输入 空格\旋转180" `
            --output-dir "测试 输出 空格\旋转180" `
            --output-name "识别结果.xlsx" 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if ($exitCode -ne 0) {
            $message = ($output -join " | ").Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=WINDOWS_ROTATE180_OCR::$message"
            throw "180度方向识别退出码不是0：$exitCode"
          }
          @'
          import zipfile
          path = r"测试 输出 空格\旋转180\识别结果.xlsx"
          with zipfile.ZipFile(path) as archive:
              sheet = archive.read("xl/worksheets/sheet1.xml").decode()
          assert "孙安宁" in sheet
          assert "990000198210070038" in sheet
          assert "成功（增强重试）" in sheet
          print("WINDOWS_ROTATE180_XLSX_OK")
          '@ | python -
